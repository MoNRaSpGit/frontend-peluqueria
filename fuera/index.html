<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Fuera de servicio</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #0c0b16; color: #f5f3ff; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      h1 { font-size: 26px; margin: 0 0 10px; }
      p { color: #9b98b8; line-height: 1.5; margin: 0 0 22px; }
      a { display: inline-block; padding: 14px 22px; border-radius: 14px; background: linear-gradient(135deg, #8b5cf6, #ff3d9a); color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fuera de servicio</h1>
      <p>Esta dirección ya no se usa. La app de reservas se mudó.</p>
      <a id="nuevo" href="https://monraspgit.github.io/frontend-reservas/">Ir a la dirección nueva</a>
    </main>
    <script>
      // Conserva el local del link viejo (#/...).
      document.getElementById("nuevo").href += location.hash;
    </script>
  </body>
</html>
